<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Snow Theme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 20px;
        }
        
        .email-link {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
        }
        
        .back-link {
            display: block;
            margin-top: 30px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get in Touch</h1>
        <p>For support inquiries or feedback about the Snow theme:</p>
        <a href="mailto:bluesparklojas@gmail.com" class="email-link">bluesparklojas@gmail.com</a>
        <br>
        <a href="index.html" class="back-link">← Back</a>
    </div>
</body>
</html>
